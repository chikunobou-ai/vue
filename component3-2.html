<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Vue2 Example</title>
</head>
<body>

<div id="blog-posts-demo">
  <blog-post
    v-for="post in posts"
    :key="post.id"
    :title="post.title"
  ></blog-post>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
<script>
Vue.component('blog-post', {
  props: ['title'],
  template: '<h4>{{ title }}</h4>'
});

new Vue({
  el: '#blog-posts-demo',
  data: {
    posts: [
      { id: 1, title: 'Vueとの航海' },
      { id: 2, title: 'Vueとの旅' },
      { id: 3, title: 'Vue旅行記' }
    ]
  }
});
</script>

</body>
</html>
